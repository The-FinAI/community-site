      try {

      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');

      // Skin preview: ?skin=ink | ?skin=swiss sticks for this browser; ?skin=default clears it.
      try {
        var q = new URLSearchParams(location.search).get('skin');
        if (q !== null) { if (q === 'ink' || q === 'swiss') localStorage.setItem('skin', q); else localStorage.removeItem('skin'); }
        var sk = localStorage.getItem('skin');
        if (sk === 'ink' || sk === 'swiss') document.documentElement.setAttribute('data-skin', sk);
      } catch (e) {}
      // Apply saved locale to <html lang> before first paint so i18n picks it up.

          var n = (navigator.language || 'en').toLowerCase();
          lc = n.indexOf('zh') === 0 ? 'zh' : n.indexOf('ja') === 0 ? 'ja' : n.indexOf('fr') === 0 ? 'fr' : 'en';
        }
        document.documentElement.setAttribute('lang', lc);
      } catch (e) {
        document.documentElement.setAttribute('lang', 'en');
      }
